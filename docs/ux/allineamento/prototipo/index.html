<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototipo — concetto A «Piano prima»</title>
<style>
:root {
  --ground: #e7eaee; --surface: #f7f8fa; --ink: #18202b; --muted: #66707c; --line: #bfc6cf;
  --thread: #c0313b; --thread-soft: rgba(192, 49, 59, 0.12);
  --done: #2f7d4f; --active: #2459c4; --todo: #7b8591; --deferred: #7346b8; --detour: #a56a0c; --ghost: #9aa3ae;
  --term-bg: #1d1f23; --term-ink: #d8dce2; --term-muted: #8a919b; --band-bg: #2a2e35;
  font-family: system-ui, sans-serif; color: var(--ink); background: var(--ground);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { display: grid; grid-template-columns: minmax(0, 55fr) minmax(0, 45fr); grid-template-rows: auto minmax(0, 1fr); }
/* Prototype guide: not part of the product, it tells the tester what is happening and what to try */
.guide { grid-column: 1 / -1; display: flex; gap: 14px; align-items: center; padding: 10px 16px; background: #fff6d6;
  border-bottom: 1px solid #e3cf86; font-size: 14px; line-height: 1.45; }
.guide strong { flex: none; color: #7a5a00; }
.guide button { flex: none; margin-left: auto; background: #2459c4; color: #fff; border: 0; border-radius: 6px; padding: 7px 14px; font-weight: 600; }
.guide button:disabled { background: #a9b4c4; cursor: default; }
button { font: inherit; color: inherit; cursor: pointer; }

/* Terminal: Claude Code with the band above the prompt */
.term { display: grid; grid-template-rows: auto 1fr auto auto; background: var(--term-bg); color: var(--term-ink);
  font: 13px/1.5 ui-monospace, 'SF Mono', Menlo, monospace; min-height: 0; }
.term header { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px;
  border-bottom: 1px solid #333840; color: var(--term-muted); }
.term header button { background: #3a404a; border: 1px solid #4b525d; border-radius: 4px; padding: 2px 10px; color: var(--term-ink); }
.chat { overflow-y: auto; padding: 12px 14px; min-height: 0; }
.msg { margin: 0 0 10px; white-space: pre-wrap; }
.msg.user::before { content: '> '; color: var(--term-muted); }
.msg.agent { color: #e6e1cf; }
.msg.agent::before { content: '⏺ '; color: #d9a35b; }
.msg.sys { color: var(--term-muted); font-style: italic; }
.msg.note { border-left: 2px solid #d9a35b; padding-left: 8px; color: #c9c3b0; }
.msg.summary { border: 1px dashed #59606b; padding: 8px; color: #b8c4d6; }
.band { background: var(--band-bg); border-top: 1px solid #3a404a; padding: 6px 12px; }
.band .where { color: #f0f2f5; }
.band .where b { color: #ff8a8f; font-weight: 600; }
.band .row { margin-top: 3px; }
.band .proposal { color: #ffd479; }
.band .back { color: #9fd0ff; }
.band .detour { color: #f1b45f; }
.band .update { color: #8fd19e; }
.band .away { color: #ffd479; }
.band button { background: #454c57; border: 1px solid #5b6370; border-radius: 4px; padding: 1px 9px; margin-left: 6px; color: #fff; font: inherit; }
.band button.yes { background: #2f7d4f; border-color: #3d9a63; }
.band button.no { background: #8a2f36; border-color: #a93c45; }
.prompt { display: flex; gap: 8px; padding: 8px 12px 12px; border-top: 1px solid #333840; }
.prompt span { color: var(--term-muted); }
.prompt input { flex: 1; background: transparent; border: 0; color: var(--term-ink); font: inherit; outline: none; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 0 12px 10px; color: var(--term-muted); font-size: 12px; }
.legend button { background: transparent; border: 1px solid #4b525d; border-radius: 12px; padding: 1px 10px; color: var(--term-ink); font: inherit; }

/* Viewer: read-only, in the browser beside the terminal */
.viewer { display: grid; grid-template-rows: auto 1fr auto; min-height: 0; border-left: 1px solid var(--line); }
.viewer header { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 14px;
  background: var(--surface); border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.viewer header strong { color: var(--ink); }
.viewer header button { background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px; font-size: 12px; }
.graph { overflow-y: auto; padding: 14px; min-height: 0; }
.milestone { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 12px; }
.milestone > .node { font-weight: 600; }
.children { margin-left: 14px; border-left: 2px solid var(--line); padding-left: 10px; }
.children.on-thread { border-left-color: var(--thread); }
.node { display: flex; align-items: baseline; gap: 6px; width: 100%; text-align: left; background: none; border: 1px solid transparent;
  border-radius: 6px; padding: 3px 6px; margin: 2px 0; font-size: 13.5px; }
.node:hover { background: #fff; border-color: var(--line); }
.node .sym { width: 1.1em; flex: none; text-align: center; color: var(--k); }
.node .id { color: var(--muted); font-size: 12px; flex: none; }
.node .title { overflow-wrap: anywhere; }
.node .tag { margin-left: auto; flex: none; font-size: 11px; color: var(--muted); }
.k-done { --k: var(--done); } .k-active { --k: var(--active); } .k-todo { --k: var(--todo); }
.k-deferred { --k: var(--deferred); } .k-deferred .title { color: var(--muted); }
.k-replaced { --k: var(--ghost); opacity: 0.6; } .k-replaced .title { text-decoration: line-through; color: var(--muted); }
.node.current { background: var(--thread-soft); border-color: var(--thread); }
.node.thread .title { text-decoration: underline 2px var(--thread-soft); text-underline-offset: 3px; }
.node.uncertain { opacity: 0.55; }
.node.selected { outline: 2px solid var(--ink); }
.node.ghost { border: 1px dashed var(--ghost); color: var(--ghost); background: repeating-linear-gradient(135deg, transparent 0 6px, rgba(0,0,0,0.03) 6px 12px); }
.node.ghost .sym { color: var(--ghost); }
.node.unconfirmed { border: 1px dashed var(--detour); background: #fdf6e8; }
.node.flash { animation: flash 0.9s ease-out 2; }
@keyframes flash { 50% { background: #fff3c4; } }
.detour-wrap { margin-left: 22px; border-left: 2px dashed var(--detour); padding-left: 8px; }
.detour-wrap .node .sym { color: var(--detour); }
.empty { color: var(--muted); font-size: 13px; font-style: italic; padding: 4px 6px; }
.more { color: var(--muted); font-size: 12px; padding: 2px 6px; background: none; border: 0; }
.detail { border-top: 1px solid var(--line); background: var(--surface); padding: 10px 14px; font-size: 13px; max-height: 40%; overflow-y: auto; }
.detail h3 { margin: 0 0 6px; font-size: 14px; }
.detail dl { display: grid; grid-template-columns: max-content 1fr; gap: 3px 10px; margin: 0; }
.detail dt { color: var(--muted); }
.detail dd { margin: 0; overflow-wrap: anywhere; }
.agent-view { white-space: pre-wrap; font: 12.5px/1.5 ui-monospace, Menlo, monospace; background: #fff; border: 1px solid var(--line);
  border-radius: 6px; padding: 10px; margin-bottom: 12px; }
</style>
</head>
<body>

<div class="guide" aria-live="polite"><strong>Guida al prototipo</strong><span id="guide"></span><button id="advance">▶ Fai lavorare l'agente</button></div>

<section class="term" aria-label="Terminale di Claude Code (simulato)">
  <header><span>Claude Code (simulato) · checkout-api</span></header>
  <div class="chat" id="chat" aria-live="polite"></div>
  <div class="band" id="band" aria-live="polite"></div>
  <div>
    <form class="prompt" id="form"><span>&gt;</span><input id="input" autocomplete="off" placeholder="scrivi in chat e premi Invio"></form>
    <div class="legend">Prova a scrivere:
      <button data-say="/btw perché il provider chiude le connessioni dopo 30 s?">/btw una domanda laterale</button>
      <button data-say="sposta m2.1b sotto m1">sposta m2.1b sotto m1</button>
      <button data-say="/clear">/clear</button>
      <button data-away>vai via per 3 ore</button>
    </div>
  </div>
</section>

<section class="viewer" aria-label="Viewer del grafo (sola lettura)">
  <header>
    <span><strong>ariadne</strong> · checkout-api · sola lettura</span>
    <button id="toggle-agent" aria-pressed="false">Cosa legge l'agente</button>
  </header>
  <div class="graph" id="graph"></div>
  <div class="detail" id="detail" hidden></div>
</section>

<script>
// Fake project: a payment timeout being debugged. Shape follows docs/ux/allineamento/concetti.md.
const TODAY = '2026-11-08'
// R25: what the agent may do alone, agreed when the plan was approved.
const MANDATE = 'passi dentro la milestone corrente e deviazioni brevi; mai milestone nuove, rinvii o cambi d\'obiettivo'
const file = ref => ({ type: 'file', ref })
const commit = ref => ({ type: 'commit', ref })
const message = ref => ({ type: 'message', ref })
const ok = { at: '2026-11-06', ref: 'chat' }

let nodes = [
  { id: 'm1', kind: 'milestone', title: 'M1 Diagnosi', status: 'done', what: 'Causa trovata: il pool di connessioni verso il provider si esaurisce sotto carico.', proof: [file('docs/diagnosi.md')], by: 'user', at: '2026-11-06', confirmed: ok },
  { id: 'm1.1', parent: 'm1', kind: 'step', title: 'Raccogliere i log dei timeout', status: 'done', what: '312 timeout in 48 ore, tutti su /payments/confirm.', proof: [file('logs/timeouts-2026-11-05.txt')], by: 'agent', at: '2026-11-06' },
  { id: 'm1.2', parent: 'm1', after: ['m1.1'], kind: 'step', title: 'Ipotesi: pool di connessioni esaurito', status: 'done', what: 'Ipotesi scelta tra tre (pool, DNS, rate limit del provider).', proof: [], uncertain: 'nessun commit né file: dedotta solo in chat', by: 'agent', at: '2026-11-06' },
  { id: 'm1.3', parent: 'm1', after: ['m1.2'], kind: 'step', title: 'Confermare con le metriche', status: 'done', what: 'Pool al 100% in tutti i picchi di timeout.', proof: [commit('8e41d0a'), file('docs/diagnosi.md')], by: 'agent', at: '2026-11-07' },
  { id: 'd1', parent: 'm1', after: ['m1.3'], kind: 'detour', title: 'Allarme sul pool in Grafana', status: 'deferred', deferred_to: 'm3.1', why: 'Utile ma non blocca la correzione.', what: 'Rimandato a M3.', proof: [message('chat 2026-11-07')], by: 'user', at: '2026-11-07', confirmed: ok },
  { id: 'm2', after: ['m1'], kind: 'milestone', title: 'M2 Correzione', status: 'active', what: 'Correggere il timeout senza cambiare l\'API pubblica.', mandate: MANDATE, proof: [message('piano approvato il 2026-11-07')], by: 'user', at: '2026-11-07', confirmed: ok },
  { id: 'm2.1', parent: 'm2', kind: 'step', title: 'Riprodurre il timeout in un test', status: 'active', what: 'Un test che fallisce con il pool a 2 connessioni.', proof: [message('piano approvato il 2026-11-07')], by: 'user', at: '2026-11-07' },
  { id: 'm2.2', parent: 'm2', after: ['m2.1'], kind: 'step', title: 'Patch del retry con backoff', status: 'todo', what: 'Retry con backoff esponenziale sulle chiamate al provider.', proof: [message('piano approvato il 2026-11-07')], by: 'user', at: '2026-11-07' },
  { id: 'm3', after: ['m2'], kind: 'milestone', title: 'M3 Rilascio', status: 'todo', what: 'Portare la correzione in produzione.', proof: [message('piano approvato il 2026-11-06')], by: 'user', at: '2026-11-06', confirmed: ok },
  { id: 'm3.1', parent: 'm3', kind: 'step', title: 'Allarme sul pool in Grafana', status: 'todo', continues: 'd1', what: 'Riprende d1, rimandato in M1.', proof: [message('rinvio di d1')], by: 'user', at: '2026-11-07' },
]
let current = 'm2.1'
let stage = 'start'
let pending = null // { text, ghosts: [ids], approve(), reject() }
let selected = null
let showAgent = false
let lastUpdate = ''
let pick = false // after "Torna alla lista": a number picks a point
let queue = [] // R26: what happened while you were away, reviewed on return

const $ = id => document.getElementById(id)
const get = id => nodes.find(n => n.id === id)
const real = () => nodes.filter(n => !n.ghost)
const childrenOf = id => nodes.filter(n => n.parent === id && n.kind !== 'detour')
const detoursOf = id => nodes.filter(n => n.kind === 'detour' && n.after?.[0] === id)
const containers = id => { const out = []; for (let n = get(id)?.parent; n; n = get(n).parent) out.unshift(n); return out }
const list = () => real().find(n => n.kind === 'list' && n.status === 'active')
const points = () => (list() ? childrenOf(list().id) : [])
const decided = () => points().filter(p => p.status === 'done').length

function say(who, text) {
  const p = document.createElement('p')
  p.className = `msg ${who}`
  p.textContent = text
  $('chat').append(p)
  $('chat').scrollTop = $('chat').scrollHeight
}

/** Plan order: depth-first over containers, detours right after the node they leave. */
function order() {
  const out = []
  const walk = id => { out.push(id); for (const c of childrenOf(id)) walk(c.id); for (const d of detoursOf(id)) walk(d.id) }
  for (const top of real().filter(n => !n.parent)) walk(top.id)
  return out.filter(id => !get(id).ghost)
}

function next() {
  const ids = order()
  const from = ids.indexOf(current)
  return ids.slice(from + 1).map(get).find(n => n.status === 'todo' && n.kind !== 'milestone' && n.kind !== 'list')
}

/** The thread: the current node, its containers, everything they come after, and the deferred steps they resume. */
function thread() {
  const seen = new Set()
  const walk = id => {
    const n = get(id)
    if (!n || seen.has(id)) return
    seen.add(id)
    for (const a of n.after ?? []) walk(a)
    if (n.continues) walk(n.continues)
    if (n.parent) walk(n.parent)
  }
  walk(current)
  return seen
}

function setStatus(id, status) { get(id).status = status }
function start(id) { setStatus(id, 'active'); current = id }

// ---------- what the agent does at each checkpoint (simulated) ----------

function advance() {
  pick = false
  if (pending) return say('sys', 'C\'è una proposta in attesa: approvala o rifiutala nella banda.')
  const cur = get(current)
  if (cur.kind === 'detour' && cur.status === 'active') {
    note(`${cur.id} chiuso: ${cur.title.toLowerCase()} chiarito. Prova: messaggio in chat. Rientro in ${cur.reentry}.`)
    setStatus(cur.id, 'done')
    cur.proof = [message(`chat ${TODAY}`)]
    current = cur.reentry
    return update(`deviazione chiusa · rientrato in ${get(current).title}`)
  }
  const step = stages[stage]
  step()
}

function note(text) { say('note', `Checkpoint · nota per lo scribe: ${text}`) }
function update(text) { lastUpdate = text; render() }

const stages = {
  start() {
    say('agent', 'Ho scritto test/payments/pool-timeout.test.ts: con il pool a 2 connessioni la conferma va in timeout come in produzione. Commit 3fa9c12.')
    note('m2.1 chiuso: timeout riprodotto. Prova: commit 3fa9c12. Prossimo: m2.2.')
    setStatus('m2.1', 'done')
    get('m2.1').proof = [commit('3fa9c12'), file('test/payments/pool-timeout.test.ts')]
    start('m2.2')
    stage = 'outplan'
    update('m2.1 chiuso · m2.2 avviato (dettagli: automatici)')
  },
  outplan() {
    say('agent', 'Prima della patch serve aggiornare http-client: la 4.1 non espone il timeout per singola richiesta, senza il quale il backoff non si può fare.')
    note('fuori piano: nuovo passo «Aggiornare http-client a 4.2» prima di m2.2.')
    propose({
      text: 'nuovo passo «Aggiornare http-client a 4.2» prima di m2.2',
      add: [{ id: 'm2.1b', parent: 'm2', after: ['m2.1'], kind: 'step', title: 'Aggiornare http-client a 4.2', status: 'todo', what: 'Serve il timeout per singola richiesta.', proof: [message(`proposta ${TODAY}`)], by: 'agent', at: TODAY }],
      before: 'm2.2',
      approve() { get('m2.2').after = ['m2.1b']; setStatus('m2.2', 'todo'); start('m2.1b'); stage = 'afterOutplan' },
      reject() { say('agent', 'Va bene: resto sulla 4.1 e uso un timeout globale. Continuo su m2.2.'); stage = 'list' },
    })
  },
  afterOutplan() {
    say('agent', 'http-client aggiornato a 4.2, test verdi. Commit 7b20e4d.')
    note('m2.1b chiuso: aggiornato a 4.2. Prova: commit 7b20e4d. Riprendo m2.2.')
    setStatus('m2.1b', 'done')
    get('m2.1b').proof = [commit('7b20e4d')]
    start('m2.2')
    stage = 'list'
    update('m2.1b chiuso · m2.2 avviato (dettagli: automatici)')
  },
  list() {
    say('agent', 'La review della patch ha 5 commenti. Li tratto come una lista, da decidere uno alla volta.')
    note('lista «Commenti della review» sotto m2.2, 5 punti.')
    const titles = [
      'Il retry non deve ripetere i POST non idempotenti',
      'Aggiungere jitter al backoff',
      'Numero massimo di tentativi: 3 o 5?',
      'Log a livello warn solo all\'ultimo tentativo',
      'Rinominare RetryPolicy in BackoffPolicy in tutto il modulo payments, compresi i test e la documentazione interna',
    ]
    const by = { proof: [message(`review ${TODAY}`)], by: 'agent', at: TODAY }
    propose({
      text: 'lista «Commenti della review» (5 punti) sotto m2.2',
      add: [
        { id: 'm2.2.l', parent: 'm2.2', kind: 'list', title: 'Commenti della review', status: 'todo', what: '5 commenti della review sulla patch.', ...by },
        ...titles.map((title, i) => ({ id: `m2.2.${i + 1}`, parent: 'm2.2.l', after: i ? [`m2.2.${i}`] : undefined, kind: 'point', title, status: 'todo', what: 'Da decidere.', ...by })),
      ],
      approve() { setStatus('m2.2.l', 'active'); start('m2.2.1'); stage = 'points' },
      reject() { say('agent', 'Va bene: li discutiamo in chat senza lista.'); stage = 'close' },
    })
  },
  points() {
    const cur = get(current)
    if (cur.id === 'm2.2.3' && detoursOf('m2.2.3').length === 0) {
      say('agent', 'Per scegliere tra 3 e 5 tentativi serve capire quanto aspetta il backoff nel caso peggiore. È una questione a parte.')
      note('deviazione «Durata del backoff nel caso peggiore», rientro in m2.2.3.')
      return propose({
        text: 'deviazione «Durata del backoff nel caso peggiore» · rientro: punto 3',
        add: [detour('Durata del backoff nel caso peggiore', 'agent')],
        approve() { start('m2.2.3.d') },
        reject() { say('agent', 'Ok, decido senza: 3 tentativi.') },
      })
    }
    // Point 5 is the one left open at the end: the agent decides the others first, then proposes to defer it.
    const undecided = points().filter(p => p.status !== 'done' && p.id !== 'm2.2.5' && p.id !== cur.id)
    if (cur.id === 'm2.2.5' || cur.kind !== 'point') {
      if (undecided.length === 0) { stage = 'close'; return stages.close() }
      if (cur.kind === 'point') setStatus(cur.id, 'todo')
      start(undecided[0].id)
      return update(`ora su: ${get(current).title}`)
    }
    const decision = { 'm2.2.1': 'solo GET e POST con chiave di idempotenza', 'm2.2.2': 'jitter pieno', 'm2.2.3': '3 tentativi (caso peggiore 7 s)', 'm2.2.4': 'accettato' }[cur.id] ?? 'accettato'
    note(`${cur.id} deciso: ${decision}. Prova: messaggio in chat.`)
    Object.assign(cur, { status: 'done', what: `Deciso: ${decision}.`, proof: [message(`chat ${TODAY}`)] })
    start((undecided[0] ?? get('m2.2.5')).id)
    update(`${cur.id} deciso · ${current} aperto (${decided()}/5 decisi)`)
  },
  close() {
    const p5 = get('m2.2.5')
    const deferring = p5 && p5.status !== 'done'
    say('agent', `Patch pronta, test verdi, commit c91a5e0.${deferring ? ' Il punto 5 è un refactor che non serve alla correzione: lo rimando.' : ''} Chiudo M2 e propongo il piano di M3.`)
    note(`m2.2 chiuso (commit c91a5e0)${deferring ? '; punto 5 rimandato a m3.4' : ''}; M2 chiusa; piano M3.`)
    const by = { proof: [message(`piano proposto ${TODAY}`)], by: 'agent', at: TODAY }
    propose({
      text: `chiudere M2${deferring ? ', rimandare il punto 5 a M3' : ''} e il piano di M3 (3 passi)`,
      add: [
        { id: 'm3.2', parent: 'm3', after: ['m3.1'], kind: 'step', title: 'Deploy in staging dietro feature flag e verifica del tasso di errore per 24 ore', status: 'todo', what: 'Tasso di errore sotto lo 0,1% per 24 ore.', ...by },
        { id: 'm3.3', parent: 'm3', after: ['m3.2'], kind: 'step', title: 'Rilascio in produzione', status: 'todo', what: 'Flag acceso al 100%.', ...by },
        ...(deferring ? [{ id: 'm3.4', parent: 'm3', after: ['m3.3'], kind: 'step', title: 'Rinominare RetryPolicy in BackoffPolicy', status: 'todo', continues: 'm2.2.5', what: 'Riprende il punto 5 della review.', ...by }] : []),
      ],
      approve() {
        if (deferring) { Object.assign(p5, { status: 'deferred', deferred_to: 'm3.4', why: 'refactor non necessario alla correzione', confirmed: { at: TODAY, ref: 'banda' } }) }
        if (get('m2.2.l')) setStatus('m2.2.l', 'done')
        Object.assign(get('m2.2'), { status: 'done', proof: [commit('c91a5e0')] })
        setStatus('m2', 'done')
        setStatus('m3', 'active')
        start('m3.1')
        stage = 'end'
      },
      reject() { say('agent', 'Va bene: lascio M2 aperta. Dimmi cosa cambiare nel piano di M3.') ; stage = 'end' },
    })
  },
  end() {
    say('sys', 'Fine dello scenario. Prova /clear per vedere cosa legge l\'agente quando riparte, oppure ricarica la pagina per rifare il giro.')
  },
}

function detour(title, by) {
  const from = get(current)
  return { id: `${from.id}.d`, parent: from.parent, after: [from.id], kind: 'detour', title, status: 'todo', reentry: from.id,
    what: 'Questione laterale.', proof: [message(`chat ${TODAY}`)], by, at: TODAY }
}

function propose({ text, add, before, approve, reject }) {
  for (const n of add) {
    n.ghost = true
    const at = before ? nodes.indexOf(get(before)) : nodes.length
    nodes.splice(at, 0, n)
  }
  pending = {
    text,
    ghosts: add.map(n => n.id),
    approve() {
      for (const id of this.ghosts) { const n = get(id); delete n.ghost; if (n.kind !== 'point' && n.kind !== 'list') n.confirmed = { at: TODAY, ref: 'banda' } }
      approve()
      say('sys', `Approvato: ${text}.`)
    },
    reject() {
      nodes = nodes.filter(n => !this.ghosts.includes(n.id))
      say('sys', `Rifiutato: ${text}. Il grafo non cambia.`)
      reject()
    },
  }
  render()
}

// ---------- what you do ----------

function answer(yes) {
  if (!pending) return say('sys', 'Nessuna proposta in attesa.')
  const p = pending
  pending = null
  yes ? p.approve() : p.reject()
  lastUpdate = `${yes ? 'approvato' : 'rifiutato, il grafo non cambia'}: ${p.text}`
  render()
}

function goBack() {
  const cur = get(current)
  if (cur.kind === 'detour' && cur.status === 'active') {
    setStatus(cur.id, 'done')
    current = cur.reentry
    say('sys', `Deviazione chiusa, sei di nuovo su: ${get(current).title}.`)
    return update(`rientrato in ${get(current).title}`)
  }
  if (!list()) return say('sys', 'Non sei dentro una lista: niente a cui tornare.')
  pick = true
  const lines = points().map((p, i) => `  ${p.status === 'done' ? '✓' : p.id === current ? '▶' : '·'} ${i + 1}. ${p.title}`)
  say('agent', `↩ ${list().title} (${decided()}/5 decisi)\n${lines.join('\n')}\nScrivi il numero del punto da discutere.`)
  render()
  $('input').focus()
}

function command(text) {
  const t = text.trim()
  say('user', t)
  const lower = t.toLowerCase()
  if (pick && /^\d$/.test(t)) {
    const p = points()[Number(t) - 1]
    pick = false
    if (!p) return say('sys', 'Numero fuori lista.')
    if (get(current).kind === 'point' && get(current).status === 'active') setStatus(current, 'todo')
    if (p.status !== 'done') setStatus(p.id, 'active')
    current = p.id
    return update(`ora su: punto ${t}`)
  }
  pick = false
  if (lower === '/clear') return clearChat()
  if (/^(approvo|sì|si|ok)$/.test(lower)) return answer(true)
  if (/^(rifiuto|no)$/.test(lower)) return answer(false)
  if (lower === 'torna') return goBack()
  const side = t.match(/^\/(btw|subtask)\s+(.+)/)
  if (side) {
    if (pending) return say('sys', 'Prima decidi la proposta in attesa.')
    const n = detour(side[2].slice(0, 60), 'user')
    if (get(n.id)) n.id += '2'
    n.status = 'active'
    n.confirmed = { at: TODAY, ref: 'chat' }
    nodes.splice(nodes.indexOf(get(current)) + 1, 0, n)
    say('agent', `Apro una deviazione: «${n.title}». Rientro in ${current} quando chiudiamo («Chiudi e torna» nella banda).`)
    current = n.id
    return update('deviazione aperta da te: confermata dalla tua richiesta')
  }
  const move = t.match(/^sposta\s+(.+?)\s+sotto\s+(\S+)$/i)
  if (move) {
    const what = get(move[1]) ?? real().find(n => n.title.toLowerCase().includes(move[1].toLowerCase()))
    const where = get(move[2]) ?? real().find(n => n.title.toLowerCase().includes(move[2].toLowerCase()))
    if (!what || !where) return say('agent', 'Non trovo uno dei due nodi: usa l\'id che vedi nel viewer (es. «sposta m2.1b sotto m1»).')
    Object.assign(what, { parent: where.id, after: undefined, by: 'user', at: TODAY, confirmed: { at: TODAY, ref: 'chat' } })
    say('agent', `Spostato «${what.title}» sotto «${where.title}». Firmato da te, con la data di oggi.`)
    return update(`${what.id} spostato sotto ${where.id} (correzione tua)`)
  }
  say('agent', '(simulato) Ricevuto. Non è un checkpoint: il grafo non cambia.')
}

function clearChat() {
  $('chat').replaceChildren()
  say('sys', 'Conversazione cancellata. All\'avvio l\'hook inietta il riassunto qui sotto, calcolato dal grafo senza modello (R7):')
  say('summary', summary())
}

/** R7: lineage of the current step, open detours, next step, how to ask for more. Computed, never written. */
function summary() {
  const cur = get(current)
  const path = [...containers(current), current].map(id => get(id).title).join(' › ')
  const behind = [...thread()].filter(id => id !== current && !containers(current).includes(id) && get(id).kind !== 'milestone')
    .map(get).filter(n => n.status === 'done').slice(0, 3).map(n => `- ${n.id} ${n.title}: ${n.what}${n.uncertain ? ` (incerto: ${n.uncertain})` : ''}`)
  const reentries = real().filter(n => n.kind === 'detour' && (n.status === 'active' || n.status === 'todo'))
    .map(n => `- ${n.title} → rientra in ${n.reentry}`)
  const nx = next()
  const text = [
    `Sei in: ${path} (${cur.status})`,
    'Da dove viene (solo le dipendenze):', ...(behind.length ? behind : ['- (inizio del ramo)']),
    `Rientri in sospeso: ${reentries.length ? '\n' + reentries.join('\n') : 'nessuno'}`,
    `Prossimo: ${nx ? `${nx.id} ${nx.title}` : 'nessuno nel piano'}`,
    'Per approfondire: ariadne show <id> · ariadne why <id>',
  ].join('\n')
  return `${text}\n≈ ${Math.ceil(text.length / 4)} token (limite 300)`
}

// ---------- rendering ----------

const SYM = { done: '✓', active: '●', todo: '○', deferred: '↷', replaced: '⊘' }
const LIMIT = 3 // profilo standard: figli aperti per livello (R4)

function nodeButton(n, onThread) {
  const b = document.createElement('button')
  b.className = `node k-${n.status}`
  b.dataset.id = n.id
  if (n.id === current) b.classList.add('current')
  else if (onThread.has(n.id)) b.classList.add('thread')
  if (n.uncertain) b.classList.add('uncertain')
  if (n.ghost) b.classList.add('ghost')
  if (n.unconfirmed) b.classList.add('unconfirmed')
  if (n.id === selected) b.classList.add('selected')
  const sym = n.ghost ? '+' : n.kind === 'detour' && n.status !== 'deferred' && n.status !== 'replaced' ? '⤷' : SYM[n.status]
  const tag = n.ghost ? 'proposta' : n.unconfirmed ? 'da confermare' : n.rejected ? 'rifiutato' : n.status === 'deferred' ? `→ ${n.deferred_to}` : n.kind === 'list' ? `${childrenOf(n.id).filter(p => p.status === 'done').length}/${childrenOf(n.id).length}` : n.by === 'user' && n.kind !== 'milestone' ? 'tu' : ''
  b.innerHTML = `<span class="sym"></span><span class="id"></span><span class="title"></span>${n.uncertain ? '<span title="">?</span>' : ''}<span class="tag"></span>`
  b.querySelector('.sym').textContent = sym
  b.querySelector('.id').textContent = n.id
  b.querySelector('.title').textContent = n.title
  b.querySelector('.tag').textContent = tag
  if (n.uncertain) b.querySelector('span[title]').title = n.uncertain
  b.title = n.what
  b.onclick = () => { selected = selected === n.id ? null : n.id; render() }
  return b
}

function renderChildren(id, onThread, expanded) {
  const box = document.createElement('div')
  box.className = 'children' + (onThread.has(id) ? ' on-thread' : '')
  let kids = childrenOf(id)
  // Readability profile: a level shows at most LIMIT children open around the current one; the rest fold.
  if (kids.length > LIMIT + 1 && !expanded.has(id) && !kids.some(k => k.ghost)) {
    // The window always contains where you are: the current node, what contains it, or the node a current detour leaves from.
    const here = k => k.id === current || containers(current).includes(k.id) || get(current).after?.[0] === k.id
    const focus = Math.max(0, kids.findIndex(here), kids.findIndex(k => k.ghost))
    const startAt = Math.min(Math.max(0, focus - 1), kids.length - LIMIT)
    const hidden = kids.length - LIMIT
    const shown = kids.slice(startAt, startAt + LIMIT)
    kids = shown
    box.dataset.hidden = hidden
  }
  for (const k of kids) {
    box.append(nodeButton(k, onThread))
    const inner = childrenOf(k.id)
    if (inner.length && (onThread.has(k.id) || inner.some(c => c.ghost) || expanded.has(k.id))) box.append(renderChildren(k.id, onThread, expanded))
    for (const d of detoursOf(k.id)) {
      const w = document.createElement('div')
      w.className = 'detour-wrap'
      w.append(nodeButton(d, onThread))
      box.append(w)
    }
  }
  if (box.dataset.hidden) {
    const more = document.createElement('button')
    more.className = 'more'
    more.textContent = `+ altri ${box.dataset.hidden} (profilo standard: ${LIMIT} per livello) · mostra`
    more.onclick = () => { expandedIds.add(id); render() }
    box.append(more)
  }
  return box
}

const expandedIds = new Set()

function renderGraph() {
  const g = $('graph')
  g.replaceChildren()
  const onThread = thread()
  if (showAgent) {
    const pre = document.createElement('div')
    pre.className = 'agent-view'
    pre.textContent = summary()
    g.append(pre)
  }
  for (const m of real().filter(n => !n.parent)) {
    const box = document.createElement('div')
    box.className = 'milestone'
    box.append(nodeButton(m, onThread))
    for (const d of detoursOf(m.id)) box.append(nodeButton(d, onThread))
    if (nodes.some(n => n.parent === m.id && n.kind !== 'detour')) box.append(renderChildren(m.id, onThread, expandedIds))
    for (const d of nodes.filter(n => n.parent === m.id && n.kind === 'detour' && !get(n.after?.[0])?.parent)) box.append(nodeButton(d, onThread))
    if (!nodes.some(n => n.parent === m.id)) {
      const e = document.createElement('div')
      e.className = 'empty'
      e.textContent = 'Piano non ancora proposto: l\'agente lo propone quando si apre la milestone.'
      box.append(e)
    }
    g.append(box)
  }
}

function renderDetail() {
  const d = $('detail')
  const n = get(selected)
  d.hidden = !n
  if (!n) return
  const rows = [
    ['Cosa', n.what],
    n.why && ['Perché', n.why],
    ['Stato', n.ghost ? 'proposta, in attesa della tua approvazione' : n.status],
    ['Prova', n.proof.length ? n.proof.map(p => `${p.type}: ${p.ref}`).join(' · ') : '—'],
    n.uncertain && ['Incerto', n.uncertain],
    ['Deciso da', `${n.by === 'user' ? 'tu' : 'agente'}, ${n.at}`],
    n.confirmed && ['Confermato', `da te il ${n.confirmed.at} (${n.confirmed.ref})`],
    n.unconfirmed && ['Da confermare', 'fatto dall\'agente in tua assenza, dentro il mandato'],
    n.mandate && ['Mandato', n.mandate],
    n.reentry && ['Rientra in', n.reentry],
    n.deferred_to && ['Rimandato a', n.deferred_to],
    n.continues && ['Riprende', n.continues],
  ].filter(Boolean)
  d.innerHTML = '<h3></h3><dl></dl>'
  d.querySelector('h3').textContent = `${n.id} — ${n.title}`
  for (const [k, v] of rows) {
    const dt = document.createElement('dt'); dt.textContent = k
    const dd = document.createElement('dd'); dd.textContent = v
    d.querySelector('dl').append(dt, dd)
  }
}

function renderBand() {
  const band = $('band')
  band.replaceChildren()
  const row = (cls, html) => { const r = document.createElement('div'); r.className = `row ${cls}`; r.innerHTML = html; band.append(r) }
  const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c])
  // The band is read at a glance: one line per row, long titles cut (the viewer has them whole).
  const short = (s, max = 38) => esc(s.length > max ? s.slice(0, max - 1) + '…' : s)
  const path = containers(current).filter(id => get(id).kind !== 'list').map(id => short(get(id).title, 24))
  const nx = next()
  row('where', `${path.join(' › ')} › <b>${short(get(current).title, 44)}</b>${nx ? ` · prossimo: ${short(nx.title, 30)}` : ''}`)
  const cur = get(current)
  if (cur.kind === 'detour' && cur.status === 'active') row('detour', `⤷ deviazione · rientro: ${short(get(cur.reentry).title)} <button data-act="back">Chiudi e torna</button>`)
  else if (list()) row('back', `↩ ${esc(list().title)} (${decided()}/5 decisi) <button data-act="back">Torna alla lista</button>`)
  const item = queue.find(q => !q.done)
  if (queue.length && !queue.started && item) row('away', `⏎ Mentre eri via: ${queue.filter(q => q.kind === 'confirm').length} da confermare, ${queue.filter(q => q.kind === 'decide').length} da decidere <button class="yes" data-act="all">Approva tutto</button><button data-act="one">Rivedi una per una</button>`)
  else if (item) row('away', `⏎ ${item.kind === 'confirm' ? 'Da confermare' : 'Da decidere'} ${queue.indexOf(item) + 1}/${queue.length}: ${esc(item.text)} <button class="yes" data-act="q-yes">${item.kind === 'confirm' ? 'Approva' : 'Fallo'}</button><button class="no" data-act="q-no">${item.kind === 'confirm' ? 'Rifiuta' : 'Lascia così'}</button>${item.id ? '<button data-act="q-show">Mostra nel grafo</button>' : ''}`)
  if (pending) row('proposal', `◆ Proposta: ${esc(pending.text)} <button class="yes" data-act="yes">Approva</button><button class="no" data-act="no">Rifiuta</button><button data-act="show">Mostra nel grafo</button>`)
  else if (lastUpdate) row('update', `↺ ${esc(lastUpdate)}`)
}

function render() { renderBand(); renderGraph(); renderDetail(); renderGuide() }

/** Plain words for the tester: what just happened and what can be done now. */
function renderGuide() {
  const cur = get(current)
  let text
  if (queue.length && !queue.started) text = 'Sei tornato dopo 3 ore. L\'agente ha lavorato da solo: dentro il mandato ha applicato le modifiche (arancioni tratteggiate nel grafo, «da confermare»); fuori dal mandato non ha applicato nulla e ti lascia una decisione. Approva tutto con 1 clic, oppure rivedi una per una.'
  else if (queue.length) text = 'Revisione al rientro: approva o rifiuta una modifica alla volta. Se rifiuti, il ramo resta tracciato ma esce dal piano.'
  else if (pending) text = 'L\'agente propone di cambiare la struttura del grafo: nel grafo a destra la modifica è tratteggiata in grigio. Decidi tu, con i pulsanti verde e rosso nella banda (la riga scura sopra il prompt).'
  else if (pick) text = 'Qui sopra in chat c\'è l\'indice della lista. Scrivi nel prompt il numero del punto da discutere e premi Invio.'
  else if (cur.kind === 'detour' && cur.status === 'active') text = 'Sei in una questione laterale (deviazione). Nel grafo è il ramo tratteggiato arancione. Quando hai finito, «Chiudi e torna» nella banda ti riporta al punto da cui eri partito.'
  else if (stage === 'start') text = 'A sinistra c\'è Claude Code, a destra il grafo nel browser. La riga scura sopra il prompt è la banda: dice dove sei e cosa viene dopo. Premi «Fai lavorare l\'agente» per farlo arrivare al prossimo checkpoint.'
  else if (stage === 'end') text = 'Scenario finito. Clicca «/clear» sotto il prompt per vedere cosa legge l\'agente quando riparte, oppure «Cosa legge l\'agente» in alto a destra. Ricarica la pagina per rifare il giro.'
  else if (list()) text = 'Siete dentro una lista di punti da decidere. Puoi far decidere all\'agente il punto corrente (pulsante blu), aprire una questione laterale («/btw» sotto il prompt), o «Torna alla lista» per scegliere un altro punto.'
  else if (lastUpdate) text = 'L\'agente ha chiuso un passo e aperto il successivo da solo (riga verde nella banda): sono dettagli, non serve la tua conferma. Il grafo a destra si è aggiornato. Premi il pulsante blu per continuare.'
  else text = 'Premi il pulsante blu per far lavorare l\'agente fino al prossimo checkpoint.'
  $('guide').textContent = text
  $('advance').disabled = Boolean(pending) || queue.length > 0 || stage === 'end'
}

function showInViewer() {
  if (!pending) return say('sys', 'Nessuna proposta da mostrare.')
  flash(pending.ghosts)
}

function flash(ids) {
  document.querySelector(`.node[data-id="${CSS.escape(ids[0])}"]`)?.scrollIntoView({ block: 'center', behavior: 'smooth' })
  for (const id of ids) document.querySelector(`.node[data-id="${CSS.escape(id)}"]`)?.classList.add('flash')
}

// ---------- away for hours (R25, R26) ----------

/** The agent works alone: inside the mandate it applies structure as "to confirm"; outside it only takes a note. */
function goAway() {
  if (pending || queue.length) return say('sys', 'Prima chiudi la proposta o la revisione in corso.')
  const ms = get(current).kind === 'milestone' ? current : containers(current)[0]
  const anchor = get(current).kind === 'milestone' ? childrenOf(ms).at(-1)?.id : [...containers(current), current][1]
  const n = childrenOf(ms).length
  const step = { id: `${ms}.a${n}`, parent: ms, after: anchor ? [anchor] : undefined, kind: 'step', title: 'Test di carico con 200 richieste concorrenti', status: 'done',
    what: 'Nessun timeout con il pool a 20 connessioni.', proof: [commit('d40b7e1')], by: 'agent', at: TODAY, unconfirmed: true }
  const side = { id: `${ms}.a${n}.d`, parent: ms, after: [step.id], kind: 'detour', title: 'Perché il test locale era lento', status: 'done', reentry: step.id,
    what: 'Il DNS locale aggiungeva 2 s: risolto con /etc/hosts.', proof: [message(`chat ${TODAY}`)], by: 'agent', at: TODAY, unconfirmed: true }
  const at = anchor ? nodes.indexOf(get(anchor)) + 1 : nodes.length
  nodes.splice(at, 0, step, side)
  say('sys', '… 3 ore dopo …')
  say('agent', `Mentre eri via: 3 checkpoint. Dentro il mandato ho aggiunto il passo «${step.title}» e una deviazione breve, entrambi da confermare. Fuori dal mandato non ho applicato nulla: avrei aperto una milestone per rifare il pool di connessioni; per ora ho tenuto il piano com'era.`)
  queue = [
    { kind: 'confirm', id: step.id, text: `nuovo passo «${step.title}»` },
    { kind: 'confirm', id: side.id, text: `deviazione «${side.title}»` },
    { kind: 'decide', text: 'aprire una milestone «Rifare il pool di connessioni»? (fuori mandato)' },
  ]
  lastUpdate = ''
  render()
}

function review(q, yes) {
  const n = q.id && get(q.id)
  if (!n) return
  delete n.unconfirmed
  if (yes) n.confirmed = { at: TODAY, ref: 'revisione al rientro' }
  else Object.assign(n, { status: 'replaced', rejected: true, confirmed: { at: TODAY, ref: 'revisione al rientro' } })
}

function reviewNext(yes) {
  const q = queue.find(q => !q.done)
  q.done = true
  if (q.kind === 'confirm') review(q, yes)
  say('sys', q.kind === 'confirm' ? `${yes ? 'Approvato' : 'Rifiutato (resta tracciato, fuori dal piano)'}: ${q.text}.` : yes ? 'Ok: l\'agente proporrà la milestone come piano da approvare.' : 'Lasciato così: il piano non cambia.')
  if (queue.every(q => q.done)) queue = []
  lastUpdate = q.kind === 'confirm' ? `${yes ? 'confermato' : 'rifiutato, resta tracciato fuori dal piano'}: ${q.text}` : yes ? 'la milestone arriverà come proposta' : 'il piano non cambia'
  render()
}

$('form').onsubmit = e => {
  e.preventDefault()
  const v = $('input').value
  $('input').value = ''
  if (v.trim()) command(v)
}
$('band').onclick = e => {
  const act = e.target.closest('button')?.dataset.act
  const actions = {
    yes: () => answer(true), no: () => answer(false), show: showInViewer, back: goBack,
    all: () => { for (const q of queue) if (q.kind === 'confirm') review(q, true); for (const q of queue) q.done = true; say('sys', 'Approvate tutte le modifiche fatte in tua assenza; le decisioni aperte restano come le aveva lasciate l\'agente.'); queue = []; lastUpdate = 'confermate tutte le modifiche fatte in tua assenza'; render() },
    one: () => { queue.started = true; render() },
    'q-yes': () => reviewNext(true), 'q-no': () => reviewNext(false),
    'q-show': () => flash([queue.find(q => !q.done).id]),
  }
  if (act) actions[act]()
}
document.querySelector('.legend').onclick = e => {
  if (e.target.closest('[data-away]')) return goAway()
  const text = e.target.closest('button')?.dataset.say
  if (text) command(text)
}
$('advance').onclick = () => advance()
$('toggle-agent').onclick = () => {
  showAgent = !showAgent
  $('toggle-agent').setAttribute('aria-pressed', showAgent)
  render()
}

say('agent', 'Riprendo da m2.1: devo scrivere un test che riproduca il timeout.')
render()
</script>
